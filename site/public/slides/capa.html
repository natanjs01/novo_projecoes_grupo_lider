<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados 1º Semestre 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap');
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071827; }
.cover { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #071827; color: #fff; font-family: Inter, Arial, sans-serif; }
.cover::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, #071827 0%, #0b2035 58%, #102f45 100%); }
.cover::after { content: ''; position: absolute; right: -180px; top: -240px; width: 880px; height: 880px; border: 1px solid rgba(0,180,216,.28); border-radius: 50%; box-shadow: 0 0 0 70px rgba(0,180,216,.04), 0 0 0 140px rgba(0,180,216,.025); }
.content { position: relative; z-index: 1; height: 100%; padding: 88px 120px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 18px; color: #94a3b8; font-size: 24px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.brand-mark { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 10px; background: #f5a623; color: #071827; font-size: 30px; font-weight: 800; }
.hero { max-width: 1120px; margin-top: 70px; }
.kicker { color: #f5a623; font-size: 22px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
h1 { margin: 25px 0 18px; font: 400 118px/.88 'Bebas Neue', Impact, sans-serif; letter-spacing: .025em; text-transform: uppercase; }
.subtitle { margin: 0; color: #b6c9db; font-size: 30px; line-height: 1.35; }
.rule { width: 120px; height: 5px; margin-top: 46px; background: #00b4d8; }
.meta { display: flex; gap: 70px; padding-top: 30px; border-top: 1px solid #234464; color: #94a3b8; font-size: 22px; }
.meta strong { display: block; margin-top: 8px; color: #fff; font-size: 25px; }
.footer { display: flex; justify-content: space-between; align-items: end; color: #66809a; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.footer span:last-child { color: #f5a623; }
</style>
</head>
<body>
<div class="cover">
  <div class="content">
    <div class="brand"><div class="brand-mark">▥</div><span>Grupo Lider Supermercados</span></div>
    <div class="hero">
      <div class="kicker">Apresentação de resultados</div>
      <h1>Análise consolidada<br>do 1º semestre 2026</h1>
      <p class="subtitle">Desempenho financeiro, evolução operacional e principais tendências do negócio</p>
      <div class="rule"></div>
    </div>
    <div class="meta">
      <div>Período<strong>Jan–Jun 2026</strong></div>
      <div>Responsável<strong>Gerência de Controladoria</strong></div>
      <div>Visão<strong>Resultados consolidados</strong></div>
    </div>
    <div class="footer"><span>Controladoria · Uso gerencial</span><span>01 / 05</span></div>
  </div>
</div>
</body>
</html>
